trigger:
  branches:
    include:
      - docker-setup

parameters:
- name: executionMode
  displayName: Execution Mode
  type: string
  default: headless
  values:
    - headless
    - headed

variables:
  ${{ if eq(parameters.executionMode, 'headless') }}:
    agentPool: 'VmDockerPool'
    HEADLESS: 'true'

  ${{ if eq(parameters.executionMode, 'headed') }}:
    agentPool: 'VmDockerHeadedPool'
    HEADLESS: 'false'

pool:
  name: $(agentPool)

steps:

- checkout: self

- script: |
    docker --version
  displayName: 'Verify Docker'

- script: |
    docker pull mcr.microsoft.com/playwright:v1.64.1-noble
  displayName: 'Pull Playwright Image'

#
# Headed Run
#
- script: |
    echo "DISPLAY=$DISPLAY"
    echo "XAUTHORITY=$XAUTHORITY"

    docker run --rm \
    -e DISPLAY=$DISPLAY \
    -e XAUTHORITY=$XAUTHORITY \
    -e HEADLESS=false \
    -v /tmp/.X11-unix:/tmp/.X11-unix \
    -v $XAUTHORITY:$XAUTHORITY:ro \
    -v $(Build.SourcesDirectory):/work \
    -w /work \
    mcr.microsoft.com/playwright:v1.64.1-noble \
    bash -c "
      npm ci &&
      npx playwright test --project=$(browser) --grep=$(tagName)
    "
  displayName: 'Verify Docker GUI Access'

#
# Headless Run
#
- script: |
    docker run --rm \
      -e HEADLESS=$(HEADLESS) \
      -v $(Build.SourcesDirectory):/work \
      -w /work \
      mcr.microsoft.com/playwright:v1.64.1-noble \
      bash -c "
        npm ci
        npx playwright test --project=$(browser) --grep=$(tagName)
      "
  condition: eq('${{ parameters.executionMode }}','headless')
  displayName: 'Run Playwright Tests (Headless)'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'reports'
    artifact: 'Playwright HTML Report'
    publishLocation: 'pipeline'
  condition: always()

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junitReport.xml'
    testRunTitle: 'Playwright Execution'
  condition: always()