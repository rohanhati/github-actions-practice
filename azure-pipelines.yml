trigger:
  branches:
    include:
      - docker-setup

# schedules:
# - cron: "07 15 * * *"
#   displayName: "Daily 20:37(ITC) pipeline trigger"
#   branches:
#     include:
#       - main
#   always: true

pool:
  vmImage: ubuntu-latest

steps:

# Checkout code
- checkout: self

# Verify Docker exists on hosted agent
- script: |
    docker --version
  displayName: 'Verify Docker Installation'


# Pull Playwright Docker Image
- script: |
    docker pull mcr.microsoft.com/playwright:v1.64.1-noble
  displayName: 'Pull Playwright Docker Image'


# Run tests inside container
- script: |
    docker run --rm \
      -v $(System.DefaultWorkingDirectory):/work \
      -w /work \
      mcr.microsoft.com/playwright:v1.64.1-noble \
      bash -c "
        npm ci &&
        npx playwright test --project=$(browser) --grep=$(tagName)
      "
  displayName: 'Run Playwright Tests in Docker'


# Publish Playwright Report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'reports'
    artifact: 'Playwright HTML Report'
    publishLocation: 'pipeline'
  condition: always()


# Publish JUnit Test Results
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junitReport.xml'
    testRunTitle: 'Playwright Docker Execution'
  condition: always()