trigger:
  branches:
    include:
      - docker-setup

pool:
  name: VmDockerPool

steps:

# Checkout code
- checkout: self

# Verify Docker
- script: |
    docker --version
  displayName: 'Verify Docker'

# Verify Display
- script: |
    echo "DISPLAY=$DISPLAY"
    who
  displayName: 'Verify Desktop Session'

# Allow Docker to access Ubuntu Desktop display
- script: |
    xhost +local:
  displayName: 'Enable X11 Access'

# Pull Playwright Image
- script: |
    docker pull mcr.microsoft.com/playwright:v1.64.1-noble
  displayName: 'Pull Playwright Image'

# Execute Tests
- script: |
    docker run --rm \
      -e DISPLAY=:0 \
      -e HEADLESS=$(HEADLESS) \
      -v /tmp/.X11-unix:/tmp/.X11-unix \
      -v $(Build.SourcesDirectory):/work \
      -w /work \
      mcr.microsoft.com/playwright:v1.64.1-noble \
      bash -c "
        npm ci
        echo HEADLESS=\$HEADLESS
        npx playwright test --project=$(browser) --grep=$(tagName)
      "
  displayName: 'Run Playwright Tests In Docker'

# Publish HTML Report
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'reports'
    artifact: 'Playwright HTML Report'
    publishLocation: 'pipeline'
  condition: always()

# Publish JUnit Results
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junitReport.xml'
    testRunTitle: 'Playwright Docker Execution'
  condition: always()