trigger:
  branches:
    include:
      - docker-setup

pool:
  name: VmDockerPool

steps:

- checkout: self

- script: |
    docker --version
  displayName: 'Verify Docker'


- script: |
    docker pull mcr.microsoft.com/playwright:v1.64.1-noble
  displayName: 'Pull Playwright Image'


- script: |
    docker run --rm \
      -e HEADLESS=false \
      -v $(Build.SourcesDirectory):/work \
      -w /work \
      mcr.microsoft.com/playwright:v1.64.1-noble \
      bash -c "
        xvfb-run -a npx playwright test
      "
  displayName: 'Run Headed Tests'


- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'reports'
    artifact: 'Playwright HTML Report'
    publishLocation: 'pipeline'
  condition: always()


- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junitReport.xml'
    testRunTitle: 'Playwright Docker Execution'
  condition: always()